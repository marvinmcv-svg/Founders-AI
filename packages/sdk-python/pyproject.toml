[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "founders-ai"
version = "0.1.0"
description = "Python client for the Founders AI private-markets API"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
license = { text = "Proprietary" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
founders_ai = ["py.typed"]
